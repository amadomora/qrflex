# ==============================================================================
# Configuración de Apache VirtualHost para QRFlex Turismo Inteligente
# Ubicación sugerida: /etc/apache2/sites-available/qrflex.conf
#
# Para activar en tu servidor Linux:
#   sudo a2enmod proxy proxy_http rewrite headers deflate
#   sudo a2ensite qrflex.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
    ServerName qrflex.local
    ServerAlias turismo.local *.qrflex.co
    ServerAdmin admin@qrflex.co

    # Directorio de archivos estáticos del Frontend
    DocumentRoot /var/www/html/qrflex

    <Directory /var/www/html/qrflex>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enrutamiento SPA: Si no existe el archivo físico, redirigir a index.html
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>
    </Directory>

    # --------------------------------------------------------------------------
    # Proxy inverso hacia el Backend Node.js (Express en puerto 5000)
    # --------------------------------------------------------------------------
    <IfModule mod_proxy.c>
        ProxyRequests Off
        ProxyPreserveHost On

        <IfModule mod_headers.c>
            # Reenvío de cabeceras de cliente para detección de idioma en Node.js
            RequestHeader set X-Forwarded-Proto "http"
            RequestHeader set X-Forwarded-Port "80"
        </IfModule>

        <IfModule mod_proxy_http.c>
            # Endpoints de la API REST del CMS de Turismo
            ProxyPass /api http://127.0.0.1:5000/api
            ProxyPassReverse /api http://127.0.0.1:5000/api

            # Endpoints dinámicos de Códigos QR (generación en vivo y métricas)
            ProxyPass /q http://127.0.0.1:5000/q
            ProxyPassReverse /q http://127.0.0.1:5000/q
        </IfModule>
    </IfModule>

    # --------------------------------------------------------------------------
    # Optimización para Móviles Turísticos: Compresión GZIP / Deflate
    # --------------------------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript application/json application/xml
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # Registros de acceso y errores
    ErrorLog ${APACHE_LOG_DIR}/qrflex_error.log
    CustomLog ${APACHE_LOG_DIR}/qrflex_access.log combined
</VirtualHost>

