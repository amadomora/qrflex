# ==============================================================================
# Apache VirtualHost para Santander Digital Oficial
# Archivo en VPS: /etc/apache2/sites-available/santanderdigital.online.conf
#
# Comandos de activación en VPS:
#   sudo a2enmod proxy proxy_http rewrite headers deflate ssl
#   sudo a2ensite santanderdigital.online.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#   sudo certbot --apache -d santanderdigital.online -d www.santanderdigital.online
# ==============================================================================

<VirtualHost *:80>
    ServerName santanderdigital.online
    ServerAlias www.santanderdigital.online
    ServerAdmin admin@santanderdigital.online

    # Directorio raíz del proyecto
    DocumentRoot /var/www/html/qrflex

    <Directory /var/www/html/qrflex>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enrutamiento de URLs limpias para páginas individuales
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Páginas individuales de los atractivos
            RewriteRule ^chicamocha/?$ chicamocha/index.html [L]
            RewriteRule ^canon-del-chicamocha/?$ chicamocha/index.html [L]
            RewriteRule ^panachi/?$ panachi/index.html [L]
            RewriteRule ^panachi-parque-nacional/?$ panachi/index.html [L]
            RewriteRule ^barichara/?$ barichara/index.html [L]
            RewriteRule ^barichara-colonial/?$ barichara/index.html [L]

            # Si el archivo o carpeta existe físicamente, servirlo
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Redirección por defecto al index
            RewriteRule ^ index.html [L]
        </IfModule>
    </Directory>

    # --------------------------------------------------------------------------
    # Proxy Inverso hacia Backend Node.js (API y Códigos QR Dinámicos)
    # --------------------------------------------------------------------------
    <IfModule mod_proxy.c>
        ProxyRequests Off
        ProxyPreserveHost On

        <IfModule mod_headers.c>
            RequestHeader set X-Forwarded-Proto "http"
            RequestHeader set X-Forwarded-Port "80"
        </IfModule>

        <IfModule mod_proxy_http.c>
            # Endpoints API REST
            ProxyPass /api http://127.0.0.1:5000/api
            ProxyPassReverse /api http://127.0.0.1:5000/api

            # Endpoints dinámicos de Códigos QR (escaneo y métricas)
            ProxyPass /q http://127.0.0.1:5000/q
            ProxyPassReverse /q http://127.0.0.1:5000/q
        </IfModule>
    </IfModule>

    # --------------------------------------------------------------------------
    # Compresión GZIP / Deflate para carga ultra rápida en zonas rurales
    # --------------------------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/santanderdigital_error.log
    CustomLog ${APACHE_LOG_DIR}/santanderdigital_access.log combined
</VirtualHost>

